name: Deploy

# Publica o site na Hostinger a cada push na main.
# O servidor é um espelho do repositório: o rsync sobe só o que mudou e
# apaga o que não vem daqui. Se algum arquivo precisar viver no servidor
# (verificação de domínio, por exemplo), ele tem que estar no Git — a
# exceção é .well-known/, protegida por causa da renovação do SSL.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar arquivos
        run: |
          rsync -az --delete --delete-excluded \
            --filter 'protect .well-known/' \
            -e "ssh -i ~/.ssh/deploy -p ${{ secrets.SSH_PORT }}" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'depoimentos/' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
